# Cassette orphan allowlist — documented exceptions to the
# "every cassette MUST have a production consumer" rule.
#
# Each entry MUST include:
#   path: <venue>/mocks/<file>.yaml  (relative to unified_api_contracts/external/)
#   reason: one of {stub-placeholder, test-only, capability-declaration-only,
#                   integration-fixture, recording-template}
#   detail: 1-line human-readable why
#   acked_by: <agent-or-operator> <YYYY-MM-DD>
#
# Adding a new entry requires operator [ack] (or self-evident category like
# stub-placeholder). The Phase 1 canary plan
# (plans/active/canary_coverage_qg_enforcement_2026_05_20.md) tracks
# decisions for non-stub orphans — they belong on the active fix list,
# NOT on this allowlist, unless the operator explicitly acks.
#
# SSOT: plans/active/canary_coverage_qg_enforcement_2026_05_20.md Phase 1.

