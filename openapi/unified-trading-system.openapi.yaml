openapi: 3.1.0
info:
  title: Unified Trading System API
  description:
    Comprehensive API spec generated from all FastAPI services in the Unified
    Trading System. Each service is represented as a tag group with its endpoints
    prefixed by /{service-name}/.
  version: 1.0.0
paths:
  /deployment-api/api/services:
    get:
      tags:
        - deployment-api
        - Services
      summary: List Services
      description:
        "List all available services with their sharding configurations.\n\
        \nReturns:\n    List of services with their descriptions and dimensions."
      operationId: list_services_api_services_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
        - APIKeyHeader: []
  /deployment-api/api/services/{service_name}:
    get:
      tags:
        - deployment-api
        - Services
      summary: Get Service Config
      description:
        "Get detailed configuration for a specific service.\n\nArgs:\n\
        \    service_name: Name of the service\n\nReturns:\n    Full sharding configuration\
        \ for the service."
      operationId: get_service_config_api_services__service_name__get
      security:
        - APIKeyHeader: []
      parameters:
        - name: service_name
          in: path
          required: true
          schema:
            type: string
            title: Service Name
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /deployment-api/api/services/{service_name}/dimensions:
    get:
      tags:
        - deployment-api
        - Services
      summary: Get Service Dimensions
      description:
        "Get dimension values for a specific service.\n\nArgs:\n    service_name:\
        \ Name of the service\n\nReturns:\n    Dimension definitions with their possible\
        \ values."
      operationId: get_service_dimensions_api_services__service_name__dimensions_get
      security:
        - APIKeyHeader: []
      parameters:
        - name: service_name
          in: path
          required: true
          schema:
            type: string
            title: Service Name
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /deployment-api/api/services/{service_name}/discover-configs:
    get:
      tags:
        - deployment-api
        - Services
      summary: Discover Configs
      description:
        "Discover config files from a cloud storage path.\n\nThis endpoint\
        \ lists all .json config files in a cloud storage directory\nand returns the\
        \ count for shard estimation.\n\nArgs:\n    service_name: Name of the service\
        \ (for validation)\n    cloud_path: Cloud storage path (gs://... or s3://...)\n\
        \nReturns:\n    List of discovered config file paths and count."
      operationId: discover_configs_api_services__service_name__discover_configs_get
      security:
        - APIKeyHeader: []
      parameters:
        - name: service_name
          in: path
          required: true
          schema:
            type: string
            title: Service Name
        - name: cloud_path
          in: query
          required: true
          schema:
            type: string
            title: Cloud Path
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /deployment-api/api/services/{service_name}/list-directories:
    get:
      tags:
        - deployment-api
        - Services
      summary: List Directories
      description:
        "List subdirectories in a cloud storage path.\n\nThis enables hierarchical\
        \ browsing of GCS directories for config selection.\n\nArgs:\n    service_name:\
        \ Name of the service (for context)\n    cloud_path: Cloud storage path (gs://bucket/prefix/)\n\
        \nReturns:\n    List of immediate subdirectory names."
      operationId: list_directories_api_services__service_name__list_directories_get
      security:
        - APIKeyHeader: []
      parameters:
        - name: service_name
          in: path
          required: true
          schema:
            type: string
            title: Service Name
        - name: cloud_path
          in: query
          required: true
          schema:
            type: string
            title: Cloud Path
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /deployment-api/api/services/{service_name}/config-buckets:
    get:
      tags:
        - deployment-api
        - Services
      summary: Get Config Buckets
      description: "Get the default config bucket(s) for a service.


        Returns the GCS bucket path where configs are typically stored."
      operationId: get_config_buckets_api_services__service_name__config_buckets_get
      security:
        - APIKeyHeader: []
      parameters:
        - name: service_name
          in: path
          required: true
          schema:
            type: string
            title: Service Name
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /deployment-api/api/deployments:
    get:
      tags:
        - deployment-api
        - Deployments
      summary: List Deployments
      description: List deployments with optional filtering and pagination.
      operationId: list_deployments_api_deployments_get
      security:
        - APIKeyHeader: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 200
            minimum: 1
            description: Max deployments to return
            default: 50
            title: Limit
          description: Max deployments to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            description: Offset for pagination
            default: 0
            title: Offset
          description: Offset for pagination
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: Filter by status
            title: Status
          description: Filter by status
        - name: service
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: Filter by service
            title: Service
          description: Filter by service
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Deployments Api Deployments Get
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    post:
      tags:
        - deployment-api
        - Deployments
      summary: Create Deployment
      description: Create a new deployment.
      operationId: create_deployment_api_deployments_post
      security:
        - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/deployment_api__routes__deployments__DeployRequest"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentResult"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /deployment-api/api/deployments/{deployment_id}:
    get:
      tags:
        - deployment-api
        - Deployments
      summary: Get Deployment Status
      description: Get detailed status for a specific deployment.
      operationId: get_deployment_status_api_deployments__deployment_id__get
      security:
        - APIKeyHeader: []
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
            title: Deployment Id
        - name: detailed
          in: query
          required: false
          schema:
            type: boolean
            description: Include detailed shard information
            default: true
            title: Detailed
          description: Include detailed shard information
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title:
                  Response Get Deployment Status Api Deployments  Deployment
                  Id  Get
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    patch:
      tags:
        - deployment-api
        - Deployments
      summary: Update Deployment
      description: Update deployment properties.
      operationId: update_deployment_api_deployments__deployment_id__patch
      security:
        - APIKeyHeader: []
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
            title: Deployment Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeploymentRequest"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Update Deployment Api Deployments  Deployment Id  Patch
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    delete:
      tags:
        - deployment-api
        - Deployments
      summary: Delete Deployment
      description: Delete a deployment and its resources.
      operationId: delete_deployment_api_deployments__deployment_id__delete
      security:
        - APIKeyHeader: []
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
            title: Deployment Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Delete Deployment Api Deployments  Deployment Id  Delete
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /deployment-api/api/deployments/{deployment_id}/verify:
    get:
      tags:
        - deployment-api
        - Deployments
      summary: Verify Deployment Completion
      description: Verify deployment completion and data integrity.
      operationId: verify_deployment_completion_api_deployments__deployment_id__verify_get
      security:
        - APIKeyHeader: []
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
            title: Deployment Id
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            description: Force refresh of verification
            default: false
            title: Force
          description: Force refresh of verification
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title:
                  Response Verify Deployment Completion Api Deployments  Deployment
                  Id  Verify Get
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /deployment-api/api/deployments/quota-info:
    post:
      tags:
        - deployment-api
        - Deployments
      summary: Quota Info
      description: Get quota requirements and recommendations for a deployment.
      operationId: quota_info_api_deployments_quota_info_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/deployment_api__routes__deployments__DeployRequest"
        required: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Quota Info Api Deployments Quota Info Post
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      security:
        - APIKeyHeader: []
  /deployment-api/api/deployments/{deployment_id}/cancel:
    post:
      tags:
        - deployment-api
        - Deployments
      summary: Cancel Deployment
      description: Cancel a running deployment.
      operationId: cancel_deployment_api_deployments__deployment_id__cancel_post
      security:
        - APIKeyHeader: []
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
            title: Deployment Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title:
                  Response Cancel Deployment Api Deployments  Deployment Id  Cancel
                  Post
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /deployment-api/api/deployments/{deployment_id}/resume:
    post:
      tags:
        - deployment-api
        - Deployments
      summary: Resume Deployment
      description: Resume a cancelled or failed deployment.
      operationId: resume_deployment_api_deployments__deployment_id__resume_post
      security:
        - APIKeyHeader: []
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
            title: Deployment Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title:
                  Response Resume Deployment Api Deployments  Deployment Id  Resume
                  Post
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /deployment-api/api/deployments/{deployment_id}/retry-failed:
    post:
      tags:
        - deployment-api
        - Deployments
      summary: Retry Failed Shards
      description: Retry failed shards in a deployment.
      operationId: retry_failed_shards_api_deployments__deployment_id__retry_failed_post
      security:
        - APIKeyHeader: []
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
            title: Deployment Id
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
            description: Preview retry without executing
            default: false
            title: Dry Run
          description: Preview retry without executing
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title:
                  Response Retry Failed Shards Api Deployments  Deployment Id  Retry
                  Failed Post
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /deployment-api/api/deployments/bulk-delete:
    post:
      tags:
        - deployment-api
        - Deployments
      summary: Bulk Delete Deployments
      description: Delete multiple deployments.
      operationId: bulk_delete_deployments_api_deployments_bulk_delete_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteRequest"
        required: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title:
                  Response Bulk Delete Deployments Api Deployments Bulk Delete
                  Post
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      security:
        - APIKeyHeader: []
  /deployment-api/api/deployments/{deployment_id}/refresh:
    post:
      tags:
        - deployment-api
        - Deployments
      summary: Refresh Deployment Status
      description: Refresh deployment status from cloud provider.
      operationId: refresh_deployment_status_api_deployments__deployment_id__refresh_post
      security:
        - APIKeyHeader: []
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
            title: Deployment Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title:
                  Response Refresh Deployment Status Api Deployments  Deployment
                  Id  Refresh Post
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /deployment-api/api/deployments/{deployment_id}/logs:
    get:
      tags:
        - deployment-api
        - Deployments
      summary: Get Deployment Logs
      description: Get deployment logs with filtering options.
      operationId: get_deployment_logs_api_deployments__deployment_id__logs_get
      security:
        - APIKeyHeader: []
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
            title: Deployment Id
        - name: shard_filter
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: Filter logs by shard pattern
            title: Shard Filter
          description: Filter logs by shard pattern
        - name: log_type
          in: query
          required: false
          schema:
            type: string
            description: "Type of logs: all, error, warning"
            default: all
            title: Log Type
          description: "Type of logs: all, error, warning"
        - name: tail
          in: query
          required: false
          schema:
            type: integer
            maximum: 10000
            minimum: 1
            description: Number of recent lines
            default: 100
            title: Tail
          description: Number of recent lines
        - name: stream
          in: query
          required: false
          schema:
            type: boolean
            description: Stream logs in real-time
            default: false
            title: Stream
          description: Stream logs in real-time
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title:
                  Response Get Deployment Logs Api Deployments  Deployment Id  Logs
                  Get
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /deployment-api/api/deployments/{deployment_id}/report:
    get:
      tags:
        - deployment-api
        - Deployments
      summary: Get Deployment Report
      description: Get a detailed deployment report with analysis and recommendations.
      operationId: get_deployment_report_api_deployments__deployment_id__report_get
      security:
        - APIKeyHeader: []
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
            title: Deployment Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title:
                  Response Get Deployment Report Api Deployments  Deployment
                  Id  Report Get
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /deployment-api/api/deployments/{deployment_id}/events:
    get:
      tags:
        - deployment-api
        - Deployments
      summary: Get Deployment Events
      description: "Return the full shard event stream for a deployment.


        Events are written by deployment-service backends to GCS as JSONL and aggregated

        here. Each event captures a lifecycle step (JOB_STARTED, VM_PREEMPTED, etc.)

        with timestamp, message, and optional metadata."
      operationId: get_deployment_events_api_deployments__deployment_id__events_get
      security:
        - APIKeyHeader: []
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
            title: Deployment Id
        - name: shard_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: Filter by shard ID
            title: Shard Id
          description: Filter by shard ID
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title:
                  Response Get Deployment Events Api Deployments  Deployment
                  Id  Events Get
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /deployment-api/api/deployments/{deployment_id}/vm-events:
    get:
      tags:
        - deployment-api
        - Deployments
      summary: Get Deployment Vm Events
      description: "Return VM-level infrastructure events for a deployment.


        Filters the full event stream to VM_PREEMPTED, VM_DELETED, VM_QUOTA_EXHAUSTED,

        VM_ZONE_UNAVAILABLE, VM_TIMEOUT, CONTAINER_OOM, CLOUD_RUN_REVISION_FAILED.

        Used by the History tab to surface infrastructure failure badges on shard
        rows."
      operationId: get_deployment_vm_events_api_deployments__deployment_id__vm_events_get
      security:
        - APIKeyHeader: []
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
            title: Deployment Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title:
                  Response Get Deployment Vm Events Api Deployments  Deployment
                  Id  Vm Events Get
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /deployment-api/api/deployments/{deployment_id}/rollback:
    post:
      tags:
        - deployment-api
        - Deployments
      summary: Rollback Live Deployment
      description:
        'Roll back a live Cloud Run Service deployment to the previous
        revision.


        Only valid for deployments with deploy_mode="live". Calls the deployment-service

        LiveDeployer to revert traffic to the specified (or previous) Cloud Run revision.'
      operationId: rollback_live_deployment_api_deployments__deployment_id__rollback_post
      security:
        - APIKeyHeader: []
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
            title: Deployment Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackRequest"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title:
                  Response Rollback Live Deployment Api Deployments  Deployment
                  Id  Rollback Post
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /deployment-api/api/deployments/{deployment_id}/live-health:
    get:
      tags:
        - deployment-api
        - Deployments
      summary: Get Live Deployment Health
      description:
        "Return the current health check status of a live Cloud Run Service.


        Polls the service /health endpoint and returns a structured response.

        Used by DeploymentDetails to show a live health badge for live-mode deployments."
      operationId: get_live_deployment_health_api_deployments__deployment_id__live_health_get
      security:
        - APIKeyHeader: []
      parameters:
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
            title: Deployment Id
        - name: service
          in: query
          required: true
          schema:
            type: string
            description: Cloud Run Service name
            title: Service
          description: Cloud Run Service name
        - name: region
          in: query
          required: true
          schema:
            type: string
            description: GCP region
            title: Region
          description: GCP region
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title:
                  Response Get Live Deployment Health Api Deployments  Deployment
                  Id  Live Health Get
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /deployment-api/api/config/region:
    get:
      tags:
        - deployment-api
        - Configuration
      summary: Get Region Config
      description: "Return the configured GCS region for UI validation.


        Used by DeployForm and DataStatusTab to warn when user selects a different
        region

        (cross-region egress costs)."
      operationId: get_region_config_api_config_region_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
        - APIKeyHeader: []
  /deployment-api/api/config/validate-region:
    get:
      tags:
        - deployment-api
        - Configuration
      summary: Validate Region
      description: "Validate requested deployment region against GCS region.


        Returns cross_region flag and warning message when deploying to a different

        region than GCS (incurs egress costs)."
      operationId: validate_region_api_config_validate_region_get
