          default: manual_strategy
        instruction_type:
          type: string
          title: Instruction Type
          description: TRADE, SWAP, LEND, BORROW, STAKE, etc.
          default: TRADE
        venue:
          type: string
          title: Venue
          description: Venue (binance, deribit, bybit, etc.)
        instrument_id:
          type: string
          title: Instrument Id
          description: Instrument (BTC-USDT, ETH-USD-PERP, etc.)
        side:
          type: string
          title: Side
          description: BUY or SELL
        quantity:
          anyOf:
            - type: number
              exclusiveMinimum: 0.0
            - type: string
              pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Quantity
          description: Order quantity (must be > 0)
        price:
          anyOf:
            - type: number
            - type: string
              pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            - type: "null"
          title: Price
          description: Limit price (None = market order)
        algo:
          anyOf:
            - type: string
            - type: "null"
          title: Algo
          description: Algorithm (MARKET, TWAP, VWAP, ICEBERG)
        algo_params:
          anyOf:
            - additionalProperties: true
              type: object
            - type: "null"
          title: Algo Params
          description: Algorithm parameters
        reason:
          type: string
          minLength: 10
          title: Reason
          description: Reason for this manual instruction (FCA audit requirement)
          default: manual_trade
      type: object
      required:
        - client_id
        - venue
        - instrument_id
        - side
        - quantity
      title: ManualInstructionRequest
      description: Request schema for manual instruction entry.
      example:
        algo: TWAP
        algo_params:
          duration_minutes: 30
          num_slices: 10
        client_id: client_123
        instruction_type: TRADE
        instrument_id: BTC-USDT
        price: 50000.0
        quantity: 1.5
        reason: portfolio_rebalancing_trade
        side: BUY
        strategy_id: manual_strategy
        venue: binance
