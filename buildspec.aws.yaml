# AWS CodeBuild Buildspec for unified-api-contracts
# Library publishing — lint, test, build wheel (no Docker), publish to CodeArtifact.
# AWS analogue of the GCP cloudbuild: GCP publishes the UAC wheel to the AR python index;
# AWS publishes it to the CodeArtifact domain `unified-trading` / repo `unified-libraries`.

version: 0.2

env:
  # NOTE: no GITHUB_TOKEN secret — UAC only builds/tests/publishes its own wheel (no repo clones).
  # The prior `secrets-manager: GITHUB_TOKEN: github-pat:token` JSON-parsed the plain-string `github-pat`
  # secret (starts with `github_pat_`) → "invalid character 'g'" at DOWNLOAD_SOURCE.
  variables:
    SERVICE_NAME: "unified-api-contracts"
    CLOUD_PROVIDER: "aws"
    CODEARTIFACT_DOMAIN: "unified-trading"
    CODEARTIFACT_REPO: "unified-libraries"

phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      - echo "=== Installing uv ==="
      - pip install uv

  pre_build:
    commands:
      - echo "=== Installing packages ==="
      - uv pip install --system -e "."
      - uv pip install --system ruff pytest

  build:
    commands:
      # Lint + tests are the QG's job (run before merge). The AWS build's role is build-wheel + publish,
      # matching GCP's UAC cloudbuild. (A bare `ruff check --line-length 120 ...` ignored the repo's ruff
      # config and flagged false positives that the configured QG ruff does not.)
      - echo "=== Building wheel ==="
      - pip install build
      - python -m build --wheel --outdir dist/

  post_build:
    commands:
      - echo "=== Publishing wheel to CodeArtifact ($CODEARTIFACT_DOMAIN/$CODEARTIFACT_REPO) ==="
      # Pin twine to 6.0.x: 6.1+ regressed CodeArtifact uploads (UnsupportedConfiguration), and 5.x can't
      # parse Metadata-Version 2.4 wheels (InvalidDistribution). 6.0.x handles both (verified: wheel published).
      - pip install "twine>=6.0,<6.1"
      # Env-var upload (no .pypirc).
      - export TWINE_USERNAME=aws
      - export TWINE_PASSWORD=$(aws codeartifact get-authorization-token --domain "$CODEARTIFACT_DOMAIN" --domain-owner "$AWS_ACCOUNT_ID" --region "$AWS_DEFAULT_REGION" --query authorizationToken --output text)
      - export TWINE_REPOSITORY_URL=$(aws codeartifact get-repository-endpoint --domain "$CODEARTIFACT_DOMAIN" --domain-owner "$AWS_ACCOUNT_ID" --repository "$CODEARTIFACT_REPO" --format pypi --region "$AWS_DEFAULT_REGION" --query repositoryEndpoint --output text)
      - twine upload --skip-existing dist/*.whl

cache:
  paths:
    - "/root/.cache/pip/**/*"
