# AWS CodeBuild Buildspec for unified-api-contracts
# Library publishing — lint, test, build wheel (no Docker), publish to CodeArtifact.
# AWS analogue of the GCP cloudbuild: GCP publishes the UAC wheel to the AR python index;
# AWS publishes it to the CodeArtifact domain `unified-trading` / repo `unified-libraries`.

version: 0.2

env:
  # NOTE: no GITHUB_TOKEN secret — UAC only builds/tests/publishes its own wheel (no repo clones).
  # The prior `secrets-manager: GITHUB_TOKEN: github-pat:token` JSON-parsed the plain-string `github-pat`
  # secret (starts with `github_pat_`) → "invalid character 'g'" at DOWNLOAD_SOURCE.
  variables:
    SERVICE_NAME: "unified-api-contracts"
    CLOUD_PROVIDER: "aws"
    CODEARTIFACT_DOMAIN: "unified-trading"
    CODEARTIFACT_REPO: "unified-libraries"

phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      - echo "=== Installing uv ==="
      - pip install uv

  pre_build:
    commands:
      - echo "=== Installing packages ==="
      - uv pip install -e "."
      - uv pip install ruff pytest

  build:
    commands:
      - echo "=== Running linting ==="
      - ruff check --line-length 120 unified_api_contracts/ || exit 1

      - echo "=== Running tests ==="
      - |
        if [ -d "tests" ]; then
          pytest tests/ -v --tb=short || exit 1
        else
          echo "No tests directory found, skipping"
        fi

      - echo "=== Building wheel ==="
      - pip install build
      - python -m build --wheel --outdir dist/

  post_build:
    commands:
      - echo "=== Publishing wheel to CodeArtifact ($CODEARTIFACT_DOMAIN/$CODEARTIFACT_REPO) ==="
      - pip install twine
      - aws codeartifact login --tool twine --domain "$CODEARTIFACT_DOMAIN" --domain-owner "$AWS_ACCOUNT_ID" --repository "$CODEARTIFACT_REPO" --region "$AWS_DEFAULT_REGION"
      - twine upload --repository codeartifact dist/*.whl --skip-existing

cache:
  paths:
    - "/root/.cache/pip/**/*"
