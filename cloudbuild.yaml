# Cloud Build Configuration for Library Publishing
# Libraries don't need Docker images - just lint, build wheel, and publish
# unified-api-contracts has zero upstream dependencies (pure Pydantic schemas)

steps:
  # Step 0: Ensure unified-libraries repo exists
  - name: "gcr.io/cloud-builders/gcloud"
    id: "ensure-repo"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud artifacts repositories describe unified-libraries --location=asia-northeast1 &>/dev/null || \
          gcloud artifacts repositories create unified-libraries --repository-format=python --location=asia-northeast1 --description="Unified Python libraries"
    waitFor: ["-"]

  # Step 1: Run lint check
  - name: "python:3.13-slim"
    id: "lint"
    waitFor: ["ensure-repo"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install uv
        uv pip install --system ruff==0.15.0
        ruff check .
        ruff format --check .

  # Step 1.5: Clone unified-trading-pm for quality-gates base scripts
  # Clones live-defi-rollout branch so base-library.sh exclusions (unified-trading-pm/
  # excluded from scans) are picked up. WORKSPACE_ROOT=/workspace resolves base-library.sh
  # at /workspace/unified-trading-pm/scripts/quality-gates-base/base-library.sh.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:alpine"
    id: "clone-pm-scripts"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        GH_PAT=$$(gcloud secrets versions access latest --secret=GH_PAT --project=$PROJECT_ID 2>/dev/null || echo "")
        if [ -n "$$GH_PAT" ] && [ ! -d "/workspace/unified-trading-pm" ]; then
          git clone --depth=1 --branch live-defi-rollout \
            "https://$$GH_PAT@github.com/IggyIkenna/unified-trading-pm.git" \
            /workspace/unified-trading-pm
          echo "Cloned unified-trading-pm to /workspace/unified-trading-pm"
        else
          echo "Skipping clone (PAT unavailable or already cloned)"
        fi
    waitFor: ["lint"]

  # Step 2: Run full quality gates (replaces inline lint/cloud-sdk checks)
  # WORKSPACE_ROOT=/workspace so quality-gates.sh resolves base-library.sh correctly.
  - name: "python:3.13-slim"
    id: "quality-gates"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        apt-get update -qq && apt-get install -y --no-install-recommends git ripgrep
        pip install --quiet uv keyrings.google-artifactregistry-auth
        mkdir -p /root/.config/pip
        printf '[global]\nextra-index-url = https://asia-northeast1-python.pkg.dev/%s/unified-libraries/simple/\n' "$PROJECT_ID" > /root/.config/pip/pip.conf
        pip install --no-cache-dir -e .
        # Upgrade pip to eliminate CVE-2026-1703 (pip 25.3 → 26.0)
        pip install --quiet "pip>=26.0"
        echo "=== pip install done ==="
        # Create minimal .venv stub so basedpyright detects a venv at project root
        # (basedpyright 1.38.2 exits 3 when no .venv — even with 0 type errors)
        mkdir -p .venv/bin
        ln -sfn "$(which python3)" .venv/bin/python
        ln -sfn "$(which python3)" .venv/bin/python3
        echo "=== venv stub created, starting quality gates ==="
        CLOUD_BUILD=true CLOUD_MOCK_MODE=true GCP_PROJECT_ID=$PROJECT_ID \
          WORKSPACE_ROOT=/workspace REPO_ROOT=/workspace \
          bash scripts/quality-gates.sh --no-fix --quick
    waitFor: ["clone-pm-scripts"]

  # Cloud SDK isolation — STEP 5.10/5.11 (hard-fail on violations)
  - name: "debian:bookworm-slim"
    id: "cloud-sdk-isolation-check"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        apt-get update -qq && apt-get install -y --no-install-recommends ripgrep
        echo "=== STEP 5.10: No direct cloud SDK imports ==="
        VIOLATIONS=$$(rg 'from google\.cloud import|^import boto3\b|^from boto3 import|^from botocore import' \
          --type py --glob '!.venv*' --glob '!**/providers/**' --glob '!**/cache.py' \
          . 2>/dev/null || true)
        [ -n "$$VIOLATIONS" ] && { echo "STEP 5.10 FAILED:"; echo "$$VIOLATIONS"; exit 1; }
        echo "STEP 5.10 passed"
        echo "=== STEP 5.11: No UTL protocol-leaking symbols ==="
        UTL=$$(rg 'from unified_trading_library import.*(CloudTarget|StandardizedDomainCloudService|upload_to_gcs_batch)' \
          --type py --glob '!.venv*' --glob '!tests/**' . 2>/dev/null || true)
        [ -n "$$UTL" ] && { echo "STEP 5.11 FAILED:"; echo "$$UTL"; exit 1; }
        echo "STEP 5.11 passed"
    waitFor: ["quality-gates"]

  - name: "python:3.13-slim"
    id: "build-wheel"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        pip install uv && uv pip install --system build
        python -m build --wheel --outdir dist/
        ls -lh dist/
    waitFor: ["quality-gates", "cloud-sdk-isolation-check"]

  # Step 2.5: Store build metadata (version → commit mapping)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:alpine"
    id: "store-metadata"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        apk add --no-cache python3

        WHEEL_FILE=$$(ls dist/*.whl)
        VERSION=$$(echo $$WHEEL_FILE | sed -n 's/.*-\([0-9.]*\)-.*/\1/p')

        echo "{\"version\":\"$$VERSION\",\"commit\":\"$COMMIT_SHA\",\"short_sha\":\"$SHORT_SHA\",\"build_id\":\"$BUILD_ID\",\"timestamp\":\"$$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > /tmp/build-metadata.json

        gsutil cp /tmp/build-metadata.json \
          gs://$PROJECT_ID-build-metadata/unified-api-contracts/versions/$$VERSION.json || true

        echo "✓ Stored build metadata for version $$VERSION"
    waitFor: ["build-wheel"]

  # Step 3: Publish Python package to Artifact Registry with version validation
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:alpine"
    id: "publish-python"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        apk add --no-cache python3 py3-pip jq
        pip3 install --break-system-packages twine keyrings.google-artifactregistry-auth

        WHEEL_FILE=$$(ls dist/*.whl)
        VERSION=$$(echo $$WHEEL_FILE | sed -n 's/.*-\([0-9.]*\)-.*/\1/p')

        # Check if version exists
        EXISTING_VERSIONS=$$(gcloud artifacts versions list \
          --package=unified-api-contracts \
          --repository=unified-libraries \
          --location=asia-northeast1 \
          --format="value(VERSION)" 2>/dev/null || echo "")

        if echo "$$EXISTING_VERSIONS" | grep -qx "$$VERSION"; then
          if gsutil cp gs://$PROJECT_ID-build-metadata/unified-api-contracts/versions/$$VERSION.json /tmp/existing-metadata.json 2>/dev/null; then
            EXISTING_COMMIT=$$(jq -r '.commit' /tmp/existing-metadata.json)

            if [ "$$EXISTING_COMMIT" = "$COMMIT_SHA" ]; then
              echo "✓ Version $$VERSION already published from commit $COMMIT_SHA (idempotent)"
              exit 0
            else
              echo "❌ ERROR: Version $$VERSION exists with DIFFERENT code!"
              echo "Current commit: $COMMIT_SHA"
              echo "Published commit: $$EXISTING_COMMIT"
              echo "Action: Bump version in pyproject.toml"
              exit 1
            fi
          else
            echo "⚠️ Version $$VERSION exists but no metadata. Bump version to be safe."
            exit 1
          fi
        fi

        # Version doesn't exist - publish
        python3 -m twine upload \
          --repository-url https://asia-northeast1-python.pkg.dev/$PROJECT_ID/unified-libraries/ \
          --non-interactive \
          dist/*.whl

        echo "✓ Successfully uploaded version $$VERSION from commit $COMMIT_SHA"
    waitFor: ["store-metadata"]

  # Step 4: Notify deployment-v3 to update stable_versions.yaml (package version)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:alpine"
    id: "notify-deployment"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        WHEEL_FILE=$$(ls dist/*.whl 2>/dev/null | head -1)
        VERSION=$$(echo $$WHEEL_FILE | sed -n 's/.*-\([0-9.]*\)-.*/\1/p')
        GH_PAT=$$(gcloud secrets versions access latest --secret=GH_PAT --project=$PROJECT_ID 2>/dev/null || echo "")
        if [ -n "$$VERSION" ] && [ -n "$$GH_PAT" ]; then
          curl -sS -X POST \
            -H "Authorization: token $$GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/IggyIkenna/deployment-service/dispatches \
            -d "{\"event_type\":\"library-published\",\"client_payload\":{\"package_name\":\"unified-api-contracts\",\"version\":\"$$VERSION\"}}"
          echo "Notified deployment-service: unified-api-contracts $$VERSION"
        else
          echo "Skipping dispatch (VERSION or GH_PAT not available)"
        fi
    waitFor: ["publish-python"]
    allowFailure: true

options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY

timeout: "600s"
