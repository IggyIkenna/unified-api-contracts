# Required per-protocol ERC-20 approvals per (archetype, chain, protocol, asset).
#
# Plan: api_keys_wallets_accounts_readiness_2026_05_10.md Phase 4.B (per-protocol
# approvals SSOT + automation).
#
# Reader: execution-service/scripts/vm/launch-defi-approval-presigner-vm.sh
# (Phase 4.B sub-deliverable) pre-signs every (chain, protocol, asset) approval
# this YAML enumerates, scoped to the May-23 cutover archetypes:
# carry_staked_basis + ARBITRAGE_PRICE_DISPERSION.
#
# Per CLAUDE.md security-grade default: ceiling = per_session_cap_usd (safer)
# over MAX_UINT256 (gas-cheaper). Operator must ratify ceiling overrides for
# any (archetype, chain, protocol, asset) row in this file.
#
# Cap units = USD-equivalent at approval time. Multiply by ERC-20 decimals at
# execution. For native assets (ETH, MATIC, SOL) the protocol uses wrapped
# variant (WETH, WMATIC, WSOL) — declared explicitly here.

version: 1
created: 2026-05-12
owner: ikenna-keys-wallets-tab (slot 4)
schema_ref: dict[archetype_id, dict[chain, dict[protocol, list[ApprovalSpec]]]]

