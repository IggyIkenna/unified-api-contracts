# Per-mode credential subset SSOT.
#
# Plan: api_keys_wallets_accounts_readiness_2026_05_10.md Phase 7.A.
#
# Three pipeline modes — paper / batch / live. Each lists the credential
# SET required to run end-to-end. Consumed by deployment-service/scripts/
# audit/credential-probe.sh (Phase 8.A) + credential_check.py (Phase 7).
#
# Credential identifiers match GCP Secret Manager paths (or AWS Secrets
# Manager paths in AWS-side deployment).

version: 1
created: 2026-05-12
owner: ikenna-keys-wallets-tab (slot 4)
schema_ref: dict[mode, list[CredentialRef]]

modes:
  paper:
    description: "Tenderly fork + mock execution. Reads market data live; fills synthetic."
    required:
      # Cloud infra (cred-free emulators work for local; real GCS for VM paper-trade)
      - id: gcp_service_account
        purpose: "GCP SA bound to paper-trade VM"
        provider: gcp
      # Market data (read-only)
      - id: copper-sandbox-api-key
        purpose: "Sandbox custody for testnet broadcasts"
      - id: api-football-key
        purpose: "Sports market data"
      - id: helius-key
        purpose: "Solana RPC"
      - id: coingecko-key
        purpose: "DeFi-data prices"
      # Tenderly fork
      - id: tenderly-access-key
        purpose: "Tenderly fork + simulation"

  batch:
    description: "Historical replay. Reads historical data; fills via execution-service matching engine."
    required:
      - id: gcp_service_account
        purpose: "GCP SA bound to batch VM"
        provider: gcp
      # Read-only venue keys for historical
      - id: bybit-read-api-key
        purpose: "Bybit historical OHLCV"
      - id: binance-read-api-key
        purpose: "Binance historical OHLCV + funding"
      - id: deribit-read-api-key
        purpose: "Deribit historical"
      # Historical-data sources
      - id: footystats-key
        purpose: "Sports historical"
      - id: soccer-football-info-key
        purpose: "Sports historical fallback"
      - id: api-football-key
        purpose: "Sports daily live mirror"
      - id: helius-key
        purpose: "Solana RPC historical"
      - id: coingecko-key
        purpose: "Historical DeFi prices"
      - id: barchart-key
        purpose: "VIX 15m preload (2020-01-02 → 2025-11-12)"
      - id: yahoo-key
        purpose: "VIX 15m rolling 60d window"
      - id: tenderly-access-key
        purpose: "Tenderly fork for batch DeFi simulation"

  live:
    description: "Production trading. Real fills on real venues; real-fund custody."
    required:
      - id: gcp_service_account
        purpose: "Trading-VM SA per asset_group"
        provider: gcp
      # Custody — May-23 cutover defaults to CLOUD_KMS_ENCRYPTED
      - id: cloud_kms_cmk_defi
        purpose: "Cloud HSM CMK for DeFi wallets"
        provider: gcp
      - id: cloud_kms_cmk_cefi
        purpose: "Cloud HSM CMK for CeFi wallets"
        provider: gcp
      # Per-wallet wrapped PKs (each follows pattern <archetype>-<chain>-<role>-vN-wrapped)
      - id: pattern:*-wrapped
        purpose: "Per-wallet wrapped private keys (10+ entries)"
        cardinality: per_wallet
      # Copper (post-June-1 flip target)
      - id: copper-api-key
        purpose: "Copper.co MPC custody (June-1 flip per-wallet)"
        post_cutover_only: true
      - id: copper-api-secret
        purpose: "Copper HMAC signing"
        post_cutover_only: true
      - id: copper-org-id
        purpose: "Copper organisation handle"
        post_cutover_only: true
      # Fireblocks (post-June-1 flip target)
      - id: fireblocks-api-key
        purpose: "Fireblocks MPC vault"
        post_cutover_only: true
      - id: fireblocks-api-secret
        purpose: "Fireblocks signing"
        post_cutover_only: true
      # CEFFU (Binance institutional — pending KYB)
      - id: ceffu-api-key
        purpose: "CEFFU OES off-exchange settlement"
        pending_kyb: true
      - id: ceffu-api-secret
        purpose: "CEFFU HMAC"
        pending_kyb: true
      # Per-venue trade keys (10 venues × 3 scopes — read / trade / withdraw)
      - id: pattern:<venue>-{read,trade,withdraw}-{api-key,api-secret,passphrase}
        purpose: "Per-venue per-scope keys (Bybit / Binance / OKX / Deribit / Hyperliquid / Aster / Upbit / Kraken / Bitfinex / Bitget × 3 scopes)"
        cardinality: per_venue_per_scope
      # Prediction venues
      - id: polymarket-api-key
        purpose: "Polymarket execution"
      - id: kalshi-api-key
        purpose: "Kalshi execution"
      # Data sources (mirrors batch)
      - id: api-football-key
        purpose: "Sports daily live"
      - id: footystats-key
        purpose: "Sports historical"
      - id: helius-key
        purpose: "Solana RPC"
      - id: coingecko-key
        purpose: "DeFi prices"
      # Aux services
      - id: telegram-bot-token-prod
        purpose: "Production alerting"
      - id: anthropic-api-key
        purpose: "Agent + advisory workflows"
