# Provider API version manifest
# Maps each external provider to its tracked API version, documentation URL,
# last-verified date, and health status.
#
# Status values:
#   green  — schema validated against live API within last 90 days
#   yellow — schema not verified recently (> 90 days) OR verification pending
#   red    — known breaking change detected (schema mismatch with live API)
#
# Semver for schema version tracked in unified_normalised_contracts is separate
# from this provider API version. See docs/canonical-schema-versioning.md.
#
# Update this file when:
#   1. A provider releases a new API version
#   2. You record a fresh VCR cassette (update last_verified)
#   3. CI schema validation detects a mismatch (set status: red)

providers:
