# Per-archetype credential subset SSOT.
#
# Plan: api_keys_wallets_accounts_readiness_2026_05_10.md Phase 7.B.
#
# Maps each cutover archetype to the MINIMUM credential set needed for live
# trading. Operator runs `python -m deployment_service.scripts.credential_check
# --archetype <name>` (Phase 7 sub-deliverable) to answer "is archetype X
# credential-blocked?".
#
# Archetype canonical names per
# codex/09-strategy/architecture-v2/archetypes/ + UAC registries.

version: 1
created: 2026-05-12
owner: ikenna-keys-wallets-tab (slot 4)
schema_ref: dict[archetype_id, ArchetypeCredentialBundle]

archetypes:
  carry_staked_basis:
    description: "ETH/SOL LST yield + perp hedge across 6 CeFi venues + DeFi lending. May-23 cutover lead archetype."
    required_credentials:
      # Custody — wallet-tier (5 chains × HOT_TRADING + 5 GAS_RESERVE)
      - cloud_kms_cmk_defi
      - "csb-eth-hot-lido-v1-wrapped"
      - "csb-arb-hot-lido-v1-wrapped"
      - "csb-base-hot-aave-v1-wrapped"
      - "csb-poly-hot-aave-v1-wrapped"
      - "csb-sol-hot-jito-v1-wrapped"
      - "gas-reserve-eth-v1-wrapped"
      - "gas-reserve-arb-v1-wrapped"
      - "gas-reserve-base-v1-wrapped"
      - "gas-reserve-poly-v1-wrapped"
      - "gas-reserve-sol-v1-wrapped"
      # Perp hedge venues (6) — real GCP Secret Manager ids (2026-05-24 reconciliation):
      #   bybit / aster = single unscoped key (no read/trade split in SM)
      #   binance / deribit trade secret = <venue>-trade-api-key-secret (not -trade-api-secret)
      #   okx = PER-CLIENT (exec-<client>-okx-*) per per-client isolation; expressed as a pattern,
      #         expanded + probed per client by credential-probe.sh
      #   hyperliquid = wallet-style key (hyperliquid-trade-key), no separate api-secret
      - bybit_api_key
      - bybit_api_secret
      - binance-trade-api-key
      - binance-trade-api-key-secret
      - deribit-trade-api-key
      - deribit-trade-api-key-secret
      - "pattern:exec-<client>-okx-api-key"
      - "pattern:exec-<client>-okx-api-secret"
      - "pattern:exec-<client>-okx-passphrase"
      - hyperliquid-trade-key
      - aster-api-key
      - aster-secret-key
      # Cross-cloud infra
      - gcp_service_account
      # Read-scope for market data (bybit uses its single bybit_api_key, already listed above)
      - binance-read-api-key
      # Data sources
      - helius-api-key
      # coingecko: keyless free public API — no Secret Manager secret required
      # Alerting
      - telegram-bot-token
    optional_credentials:
      # June-1 flip targets (config-only flip, no recompile)
      - copper-api-key
      - copper-api-secret
      - copper-org-id
      - fireblocks-api-key
      - fireblocks-api-secret
      # CEFFU (pending KYB; non-blocking if Binance perp routes through native account)
      - ceffu-api-key
      - ceffu-api-secret

  ARBITRAGE_PRICE_DISPERSION:
    description: "Cross-venue price-dispersion arbitrage. DeFi/CeFi cutover use config variant funding_rate_dispersion."
    config_variants:
      - funding_rate_dispersion
      - cross_venue_price_dispersion
    required_credentials:
      # Custody — wallet-tier (5 chains × HOT_TRADING + GAS_RESERVE shared)
      - cloud_kms_cmk_defi
      - "apd-eth-hot-uniswap-v1-wrapped"
      - "apd-arb-hot-uniswap-v1-wrapped"
      - "apd-base-hot-uniswap-v1-wrapped"
      - "apd-poly-hot-uniswap-v1-wrapped"
      - "apd-sol-hot-raydium-v1-wrapped"
      - "gas-reserve-eth-v1-wrapped"
      - "gas-reserve-arb-v1-wrapped"
      - "gas-reserve-base-v1-wrapped"
      - "gas-reserve-poly-v1-wrapped"
      - "gas-reserve-sol-v1-wrapped"
      # CeFi perp venues (for funding_rate_dispersion variant) — real Secret Manager ids
      # (see carry_staked_basis note re: bybit/aster single key, -trade-api-key-secret,
      #  okx per-client pattern, hyperliquid wallet key)
      - bybit_api_key
      - bybit_api_secret
      - binance-trade-api-key
      - binance-trade-api-key-secret
      - "pattern:exec-<client>-okx-api-key"
      - "pattern:exec-<client>-okx-api-secret"
      - "pattern:exec-<client>-okx-passphrase"
      - hyperliquid-trade-key
      - aster-api-key
      - aster-secret-key
      # Cross-cloud infra
      - gcp_service_account
      # Data
      - helius-api-key
      # coingecko: keyless free public API — no Secret Manager secret required
      # Alerting
      - telegram-bot-token
    optional_credentials:
      - copper-api-key
      - fireblocks-api-key
      - polymarket-api-key # if cross_venue_price_dispersion config variant trades Polymarket
      - kalshi-api-key

  # Sports archetypes (placeholder — populated when sports cutover scope ratified)
  MARKET_MAKING_EVENT_SETTLED:
    description: "Sports market-making on event-settled markets."
    required_credentials:
      - api-football-key
      - footystats-key
      - betfair-trade-api-key
      - gcp_service_account
      - telegram-bot-token

  ML_DIRECTIONAL_EVENT_SETTLED:
    description: "Sports ML-directional on event-settled markets."
    required_credentials:
      - api-football-key
      - footystats-key
      - soccer-football-info-key
      - betfair-trade-api-key
      - gcp_service_account
      - telegram-bot-token

  RULES_DIRECTIONAL_EVENT_SETTLED:
    description: "Sports rules-directional on event-settled markets."
    required_credentials:
      - api-football-key
      - footystats-key
      - betfair-trade-api-key
      - gcp_service_account
      - telegram-bot-token

  # Prediction archetypes
  EVENT_DRIVEN:
    description: "Prediction-market event-driven archetype."
    required_credentials:
      - polymarket-api-key
      - kalshi-api-key
      - helius-api-key # Polymarket runs on Polygon; Solana future
      - cloud_kms_cmk_prediction
      - gcp_service_account
      - telegram-bot-token
