# Yahoo Finance Mock Data - TSLA Stock Split History (2020-2024)
# This mock simulates yfinance pandas Series structure for TSLA stock splits
# Based on actual TSLA stock split events for realistic testing

metadata:
  ticker: "TSLA"
  data_type: "stock_splits"
  period: "2020-01-01 to 2024-12-31"
  source: "yfinance_mock"
  description: "Tesla Inc. stock split history"
  total_records: 2

# Raw stock split data as returned by yfinance ticker.splits
# Format: pandas Series with datetime index and split ratios
splits_series:
  "2020-08-31T00:00:00+00:00": 5.0 # 5:1 stock split - Aug 31, 2020
  "2022-08-25T00:00:00+00:00": 3.0 # 3:1 stock split - Aug 25, 2022

# Processed split records as parsed by CorporateActionsAdapter
split_records:
  - ticker: "TSLA"
    effective_date: "2020-08-31"
    ratio: 5.0
    split_from: 1
    split_to: 5
    is_reverse_split: false
    adjustment_factor: 0.2 # 1/5 = 0.2 (divide historical prices by 5)
    source: "yfinance"
    instrument_key: "NASDAQ:EQUITY:TSLA"

  - ticker: "TSLA"
    effective_date: "2022-08-25"
    ratio: 3.0
    split_from: 1
    split_to: 3
    is_reverse_split: false
    adjustment_factor: 0.3333333333333333 # 1/3 ≈ 0.333 (divide historical prices by 3)
    source: "yfinance"
    instrument_key: "NASDAQ:EQUITY:TSLA"

# Edge case examples for additional testing
edge_cases:
  # Example reverse split (not real TSLA data, but for testing)
  reverse_split_example:
    ticker: "TSLA"
    effective_date: "2025-01-01" # Hypothetical future date
    ratio: 0.5 # 1:2 reverse split
    split_from: 2
    split_to: 1
    is_reverse_split: true
    adjustment_factor: 2.0 # Multiply historical prices by 2
    source: "yfinance"

  # Example fractional split
  fractional_split_example:
    ticker: "TSLA"
    effective_date: "2025-06-01" # Hypothetical
    ratio: 1.5 # 3:2 split
    split_from: 2
    split_to: 3
    is_reverse_split: false
    adjustment_factor: 0.6666666666666666 # 1/1.5 ≈ 0.667
    source: "yfinance"

# Usage notes for testing
usage:
  adapter_method: "fetch_splits"
  date_range:
    start: "2020-01-01"
    end: "2024-12-31"
  expected_count: 2
  validation_points:
    - "All splits have ratio > 0"
    - "Forward splits have ratio >= 1.0"
    - "Reverse splits have ratio < 1.0"
    - "Adjustment factor is 1/ratio"
    - "Split dates are in ascending order"

# Stock split impact explanation
impact_analysis:
  split_2020:
    pre_split_price: "$2,213.40" # Approximate price before 5:1 split
    post_split_price: "$442.68" # Price after split (divided by 5)
    shares_multiplier: 5
    description: "Each share became 5 shares, price divided by 5"

  split_2022:
    pre_split_price: "$891.45" # Approximate price before 3:1 split
    post_split_price: "$297.15" # Price after split (divided by 3)
    shares_multiplier: 3
    description: "Each share became 3 shares, price divided by 3"
