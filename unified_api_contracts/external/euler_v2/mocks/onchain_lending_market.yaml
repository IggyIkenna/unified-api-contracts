# BLOCKED-NO-DIRECT-REST-API — Euler V2 reads are on-chain only via EVM RPC.
# Euler V2 re-launched 2024-08-29 after the 2023 V1 exploit + full restitution.
# Production calls use Alchemy RPC (eth_call) against EVK vault contracts.
# Vault addresses: see instruments-service/instruments_service/reference_data/adapters/defi/euler_v2.py
# _MVP_MARKETS — curated WETH/USDC, wstETH/WETH, USDC/USDT vaults.
# Run with INTEGRATION_TEST_MODE=live + ALCHEMY_API_KEY once credentials land.
#
# Canonical contract call shape (encoded ABI):
#   eth_call to vault.totalAssets() → uint256 (total assets in underlying token)
#   eth_call to vault.totalBorrows() → uint256 (total borrows in underlying token)
#   eth_call to vault.interestRateInfo() → (supplyApy, borrowApy, utilization) as uint256 packed
#
# Sample decoded output for WETH/USDC vault (0xD8b27CF359b7D15710a5BE299AF6e7Bf904984C2):
interactions:
  - request:
      body: '{"jsonrpc":"2.0","method":"eth_call","params":[{"to":"0xD8b27CF359b7D15710a5BE299AF6e7Bf904984C2","data":"0x01e1d114"},"latest"],"id":1}'
      headers:
        Content-Type: application/json
      method: POST
      uri: https://eth-mainnet.g.alchemy.com/v2/{ALCHEMY_API_KEY}
    response:
      body:
        string: '{"jsonrpc":"2.0","id":1,"result":"0x000000000000000000000000000000000000000000000d3c21bcecceda1000000"}'
      headers:
        Content-Type:
          - application/json
        x-contract-schema-version:
          - "1.0"
      status:
        code: 200
        message: OK
version: 1
