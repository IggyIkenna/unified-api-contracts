# Yahoo Finance Mock Data - Invalid Symbol Errors
# This mock simulates various error conditions for invalid/non-existent tickers
# Used for testing error handling in CorporateActionsAdapter

metadata:
  data_type: "error_responses"
  error_category: "invalid_symbol"
  source: "yfinance_mock"
  description: "Error responses for invalid or non-existent ticker symbols"

# Common invalid symbol scenarios
invalid_symbols:
  - symbol: "INVALID"
    description: "Non-existent ticker symbol"
  - symbol: "ZZZZ"
    description: "Invalid ticker format"
  - symbol: "123ABC"
    description: "Ticker starting with numbers"
  - symbol: ""
    description: "Empty ticker symbol"
  - symbol: " "
    description: "Whitespace-only ticker"

# yfinance exception scenarios
yfinance_exceptions:
  # No data found for ticker
  no_data_exception:
    exception_type: "ValueError"
    message: "No data found, symbol may be delisted"
    ticker: "INVALID"
    context: "When calling yf.Ticker('INVALID').dividends"

  # HTTP 404 error from Yahoo API
  http_404_error:
    exception_type: "requests.exceptions.HTTPError"
    status_code: 404
    message: "404 Client Error: Not Found"
    ticker: "NONEXISTENT"
    context: "HTTP request to Yahoo Finance API failed"

  # Network timeout
  timeout_error:
    exception_type: "requests.exceptions.Timeout"
    message: "HTTPSConnectionPool(host='query1.finance.yahoo.com'): Read timed out."
    ticker: "AAPL"
    context: "Network timeout during API request"

  # Connection error
  connection_error:
    exception_type: "requests.exceptions.ConnectionError"
    message: "HTTPSConnectionPool(host='query1.finance.yahoo.com'): Max retries exceeded"
    ticker: "MSFT"
    context: "Network connection failed"

# Empty data responses (successful request but no data)
empty_responses:
  # Empty dividends series
  empty_dividends:
    ticker: "BERKB" # Berkshire Hathaway B shares (no dividends)
    response_type: "empty_series"
    data_type: "dividends"
    pandas_series: null
    description: "Stock that doesn't pay dividends"

  # Empty stock splits series
  empty_splits:
    ticker: "BRK.A" # Berkshire Hathaway A shares (no splits)
    response_type: "empty_series"
    data_type: "splits"
    pandas_series: null
    description: "Stock that has never split"

  # Empty earnings data
  empty_earnings:
    ticker: "PRIVATE_CO" # Private company (hypothetical)
    response_type: "empty_dataframe"
    data_type: "earnings"
    pandas_dataframe: null
    description: "Private company with no public earnings"

# Malformed data responses
malformed_data:
  # NaN values in dividend amounts
  nan_dividends:
    ticker: "CORRUPTED"
    dividends_series:
      "2024-01-15T00:00:00+00:00": .nan
      "2024-04-15T00:00:00+00:00": null
      "2024-07-15T00:00:00+00:00": 0.0
    description: "Dividend data with NaN/null values"

  # Invalid split ratios
  invalid_splits:
    ticker: "BADSPLIT"
    splits_series:
      "2024-06-01T00:00:00+00:00": 0.0 # Invalid - ratio cannot be 0
      "2024-09-01T00:00:00+00:00": -2.0 # Invalid - ratio cannot be negative
    description: "Stock split data with invalid ratios"

  # Malformed earnings data
  corrupt_earnings:
    ticker: "BADEARNINGS"
    earnings_dataframe:
      columns: ["Reported EPS", "EPS Estimate", "Surprise(%)"]
      data:
        "invalid_date": # Invalid date format
          "Reported EPS": "not_a_number"
          "EPS Estimate": .inf
          "Surprise(%)": null
    description: "Earnings data with invalid values"

# Error handling responses from CorporateActionsAdapter
adapter_error_handling:
  # Empty list returned for invalid ticker
  invalid_ticker_response:
    method: "fetch_dividends"
    ticker: "INVALID"
    result: []
    log_level: "ERROR"
    log_message: "Failed to fetch dividends for INVALID: No data found"

  # Exception caught and logged
  exception_handling:
    method: "fetch_splits"
    ticker: "NETWORKERROR"
    result: []
    exception_caught: true
    log_level: "ERROR"
    log_message: "Failed to fetch splits for NETWORKERROR: Connection timeout"

# HTTP error status codes
http_errors:
  # 400 Bad Request
  bad_request:
    status_code: 400
    message: "Bad Request"
    description: "Invalid ticker format sent to API"

  # 404 Not Found
  not_found:
    status_code: 404
    message: "Not Found"
    description: "Ticker symbol not found in Yahoo Finance database"

  # 429 Too Many Requests
  rate_limited:
    status_code: 429
    message: "Too Many Requests"
    description: "Rate limit exceeded"
    retry_after: "60" # seconds

  # 500 Internal Server Error
  server_error:
    status_code: 500
    message: "Internal Server Error"
    description: "Yahoo Finance API internal error"

  # 503 Service Unavailable
  service_unavailable:
    status_code: 503
    message: "Service Temporarily Unavailable"
    description: "Yahoo Finance API temporarily down"

# Usage for testing
usage:
  test_scenarios:
    - "Test adapter handles invalid tickers gracefully"
    - "Test adapter returns empty lists for non-existent data"
    - "Test adapter logs errors appropriately"
    - "Test adapter doesn't crash on malformed data"
    - "Test adapter respects rate limits"
  validation_points:
    - "No exceptions propagate to caller"
    - "Empty results returned for invalid input"
    - "Appropriate error logging occurs"
    - "Rate limiting respected"
    - "Network errors handled gracefully"
