[tool.uv]
# pip-audit: eth-abi 4.2.1 GHSA-3qwc-47jf-5rf7 → 5.0.1; gunicorn 21.2.0 CVE-2024-* → 22.0.0
override-dependencies = [
    "eth-abi>=5.0.1",
    "gunicorn>=22.0.0",
    # aiohttp>=3.14 closes the CVE-2026-34993/47265 cookie cluster; vcrpy>=8.2.1 restored aiohttp-3.14
    # support (MockStream no longer needs the removed AsyncStreamReaderMixin). See
    # plans/active/issues/aiohttp_cve_2026_34993_vcrpy_deadlock_2026_06_03.md
    "aiohttp>=3.14.1,<4.0.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "unified-api-contracts"
dynamic = ["version"]
description = "Pydantic schemas and VCR mocks for external APIs used by UMI, UOI, and unified-trading library"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Ikenna Igboaka" }]
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.12.5,<3.0.0",
    "requests<3.0.0,>=2.33.0",
    "databento>=0.32.0,<1.0.0",
    "tardis-client>=1.3.7,<2.0.0",
    "ccxt>=4.5.24,<5.0.0",
    "ib_insync>=0.9.86,<1.0.0",
    "pytest<10.0.0,>=9.0.3",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-asyncio>=0.25.0,<2.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "pytest-json-report>=1.5.0,<2.0.0",
    "ruff==0.15.0",
    "basedpyright==1.38.2",
    "pip-audit>=2.7.0,<3.0.0",
    "bandit>=1.7.0,<2.0.0",
    "vulture>=2.0,<3.0.0",
    "vcrpy>=8.2.1,<9.0.0",
    "prek<1.0.0,>=0.4.4",
    "hypothesis>=6.0.0,<7.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "pandas>=2.3.0,<3.0.0",
    "polars>=1.37.0,<2.0.0",
    "numpy>=2.3.0,<2.4.0",
    "pyarrow>=23.0.1,<24.0.0",
    "pandas-stubs>=2.2.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/IggyIkenna/unified-api-contracts"
Repository = "https://github.com/IggyIkenna/unified-api-contracts"

# Upstream prek (PyPI) still has an unfixed corruption bug as of 0.4.11 (silently drops
# uncommitted work on a stash-restore conflict). Resolve from our patched fork's release
# wheels instead until the upstream PR merges — see
# unified-trading-pm/scripts/hooks/prek-keeper-fix/README.md. Covers darwin/linux only
# (this fleet's only real platforms); an uncovered marker falls back to vulnerable stock
# PyPI prek by uv's own resolution rules — add a windows marker+wheel here first if a
# Windows host is ever added.
[[tool.uv.sources.prek]]
url = "https://github.com/IggyIkenna/prek/releases/download/v0.4.12/prek-0.4.12-py3-none-macosx_11_0_arm64.whl"
marker = "sys_platform == 'darwin'"

[[tool.uv.sources.prek]]
url = "https://github.com/IggyIkenna/prek/releases/download/v0.4.12/prek-0.4.12-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
marker = "sys_platform == 'linux'"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "smoke: Smoke tests",
]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".cursor", ".venv", ".venv-workspace", "build", "dist", "node_modules", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "G", "C90"]
extend-ignore = ["G003", "G004"]
ignore = ["E402"]
# N815/N803: camelCase/PascalCase required for API contracts mirroring external APIs (Binance, boto3, GCP SDK)

[tool.ruff.lint.mccabe]
max-complexity = 26

[tool.ruff.lint.per-file-ignores]
"unified_api_contracts/external/binance/*.py" = ["N815", "N803", "F403", "F405"]
"unified_api_contracts/external/yahoo_finance/__init__.py" = ["N815", "F401"]
"unified_api_contracts/external/mev/*.py" = ["N815"]
"unified_api_contracts/external/**/__init__.py" = ["N815", "F401", "F403", "F405"]
"unified_api_contracts/external/*/__init__.py" = ["F401", "F403", "F405"]
"unified_api_contracts/external/**/schemas.py" = ["N815"]
"unified_api_contracts/external/aws/*.py" = ["N815", "N803"]
"unified_api_contracts/external/gcp/*.py" = ["N815", "N803"]
"unified_api_contracts/canonical/domain/account.py" = ["N815", "RUF012"]
"unified_api_contracts/canonical/domain/position/__init__.py" = ["N815", "RUF012"]
"unified_api_contracts/canonical/domain/derivatives.py" = ["N815"]
"unified_api_contracts/canonical/domain/derivatives/__init__.py" = ["N815"]
"unified_api_contracts/canonical/domain/__init__.py" = ["F401"]
"unified_api_contracts/canonical/domain/infrastructure/__init__.py" = ["F401"]
"unified_api_contracts/canonical/normalize/orders_fills.py" = ["F401"]
"unified_api_contracts/normalize_utils/*.py" = ["N815", "N803"]
"unified_api_contracts/normalize_utils/errors/*.py" = ["N815"]
# Root __init__.py re-exports all public symbols — F401 expected; RUF022 domain-grouped __all__ is intentional
"unified_api_contracts/__init__.py" = ["F401", "RUF022"]
# Registry __init__.py re-exports symbols from sub-modules
"unified_api_contracts/registry/__init__.py" = ["F401"]
# Root-level domain facades (Phase 2 citadel)
"unified_api_contracts/market.py" = ["F403", "F405"]
"unified_api_contracts/execution.py" = ["F403", "F405"]
"unified_api_contracts/reference.py" = ["F403", "F405"]
"unified_api_contracts/sports.py" = ["F403", "F405"]
"unified_api_contracts/sports_reference.py" = ["F403", "F405"]
"unified_api_contracts/position.py" = ["F403", "F405"]
"unified_api_contracts/features.py" = ["F403", "F405"]
"unified_api_contracts/derivatives.py" = ["F403", "F405"]
"unified_api_contracts/infrastructure.py" = ["F403", "F405"]
