[tool.coverage.report]
# branch=True added by 6fb90b19 lowers coverage vs statement-only baseline; recalibrated to 83
# Raised 83→90 after Phase 4 tests + stub omit expansion reaching ≥90% combined;
# Raised 90→94 after Phase 5 tests + gcp/protocols.py omit reaching 94.62% combined;
# tracked in plans/active/uac_coverage_90pct_2026_06_10.md
fail_under = 94
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]

[tool.quality-gates]
repo_arch_tier = "0"

[tool.bandit]
skips = []   # per-repo: add bandit check IDs WITH a comment explaining why (e.g. "B608: ...")

[tool.hatch.version]
source = "vcs"
