[tool.uv]
# pip-audit: eth-abi 4.2.1 GHSA-3qwc-47jf-5rf7 → 5.0.1; gunicorn 21.2.0 CVE-2024-* → 22.0.0
override-dependencies = [
    "eth-abi>=5.0.1",
    "gunicorn>=22.0.0",
    # pin <3.14 until vcrpy ships aiohttp-3.14 support (8.1.1 deadlocks on removed AsyncStreamReaderMixin);
    # CVE-2026-34993/47265 covered by the sanctioned pip-audit --ignore-vuln. See
    # plans/active/issues/aiohttp_cve_2026_34993_vcrpy_deadlock_2026_06_03.md
    "aiohttp>=3.13.4,<3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unified-api-contracts"
version = "0.2.1"
description = "Pydantic schemas and VCR mocks for external APIs used by UMI, UOI, and unified-trading library"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Ikenna Igboaka" }]
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.12.5,<3.0.0",
    "requests<3.0.0,>=2.33.0",
    "databento>=0.32.0,<1.0.0",
    "tardis-client>=1.3.7,<2.0.0",
    "ccxt>=4.5.24,<5.0.0",
    "ib_insync>=0.9.86,<1.0.0",
    "pytest<10.0.0,>=9.0.3",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-asyncio>=0.25.0,<2.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "pytest-json-report>=1.5.0,<2.0.0",
    "ruff==0.15.0",
    "basedpyright==1.38.2",
    "pip-audit>=2.7.0,<3.0.0",
    "bandit>=1.7.0,<2.0.0",
    "vulture>=2.0,<3.0.0",
    "vcrpy>=8.0.0,<9.0.0",
    "prek>=0.3.0,<1.0.0",
    "hypothesis>=6.0.0,<7.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "pandas>=2.3.0,<3.0.0",
    "polars>=1.37.0,<2.0.0",
    "numpy>=2.3.0,<2.4.0",
    "pyarrow>=23.0.0,<24.0.0",
    "pandas-stubs>=2.2.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/IggyIkenna/unified-api-contracts"
Repository = "https://github.com/IggyIkenna/unified-api-contracts"
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "smoke: Smoke tests",
]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".cursor", ".venv", ".venv-workspace", "build", "dist", "node_modules", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "G", "C90"]
extend-ignore = ["G003", "G004"]
ignore = ["E402"]
# N815/N803: camelCase/PascalCase required for API contracts mirroring external APIs (Binance, boto3, GCP SDK)

[tool.ruff.lint.mccabe]
max-complexity = 26

[tool.ruff.lint.per-file-ignores]
"unified_api_contracts/external/binance/*.py" = ["N815", "N803", "F403", "F405"]
"unified_api_contracts/external/yahoo_finance/__init__.py" = ["N815", "F401"]
"unified_api_contracts/external/mev/*.py" = ["N815"]
"unified_api_contracts/external/**/__init__.py" = ["N815", "F401", "F403", "F405"]
"unified_api_contracts/external/*/__init__.py" = ["F401", "F403", "F405"]
"unified_api_contracts/external/**/schemas.py" = ["N815"]
"unified_api_contracts/external/aws/*.py" = ["N815", "N803"]
"unified_api_contracts/external/gcp/*.py" = ["N815", "N803"]
"unified_api_contracts/canonical/domain/account.py" = ["N815", "RUF012"]
"unified_api_contracts/canonical/domain/position/__init__.py" = ["N815", "RUF012"]
"unified_api_contracts/canonical/domain/derivatives.py" = ["N815"]
"unified_api_contracts/canonical/domain/derivatives/__init__.py" = ["N815"]
"unified_api_contracts/canonical/domain/__init__.py" = ["F401"]
"unified_api_contracts/canonical/domain/infrastructure/__init__.py" = ["F401"]
"unified_api_contracts/canonical/normalize/orders_fills.py" = ["F401"]
"unified_api_contracts/normalize_utils/*.py" = ["N815", "N803"]
"unified_api_contracts/normalize_utils/errors/*.py" = ["N815"]
# Root __init__.py re-exports all public symbols — F401 expected; RUF022 domain-grouped __all__ is intentional
"unified_api_contracts/__init__.py" = ["F401", "RUF022"]
# Registry __init__.py re-exports symbols from sub-modules
"unified_api_contracts/registry/__init__.py" = ["F401"]
# Root-level domain facades (Phase 2 citadel)
"unified_api_contracts/market.py" = ["F403", "F405"]
"unified_api_contracts/execution.py" = ["F403", "F405"]
"unified_api_contracts/reference.py" = ["F403", "F405"]
"unified_api_contracts/sports.py" = ["F403", "F405"]
"unified_api_contracts/sports_reference.py" = ["F403", "F405"]
"unified_api_contracts/position.py" = ["F403", "F405"]
"unified_api_contracts/features.py" = ["F403", "F405"]
"unified_api_contracts/derivatives.py" = ["F403", "F405"]
"unified_api_contracts/infrastructure.py" = ["F403", "F405"]
"unified_api_contracts/errors.py" = ["F403", "F405"]
"unified_api_contracts/rate_limits.py" = ["F403", "F405"]
"unified_api_contracts/connectivity.py" = ["F403", "F405"]
"unified_api_contracts/latency.py" = ["F403", "F405"]
"unified_api_contracts/odds.py" = ["F403", "F405"]
"unified_api_contracts/options.py" = ["F403", "F405"]
"unified_api_contracts/prediction.py" = ["F403", "F405"]
# Internal contracts (merged from unified-internal-contracts)
# contracts.py imports sub-modules AFTER CONTRACT_REGISTRY construction (circular-import workaround)
"unified_api_contracts/internal/schemas/contracts.py" = ["E402"]
"unified_api_contracts/internal/testing/seed_*.py" = ["C901", "E501", "B007", "RUF002", "B905"]
"unified_api_contracts/internal/testing/seed_validator.py" = ["C901", "E501"]
# chain_env.py carries long provenance comment annotations for each chain entry; E501 is expected.
"unified_api_contracts/registry/chain_env.py" = ["E501"]
"unified_api_contracts/internal/domain/cefi_accounts/schemas.py" = ["N815"]
"unified_api_contracts/internal/domain/defi/eth_transfers.py" = ["N815"]
"unified_api_contracts/internal/domain/defi/protocol_sdks.py" = ["N815"]
"unified_api_contracts/internal/domain/execution_service/cex_withdrawals.py" = ["N815"]
# Transition facades at canonical level
"unified_api_contracts/canonical/execution.py" = ["F403", "F405"]
"unified_api_contracts/canonical/options.py" = ["F403", "F405"]
"unified_api_contracts/canonical/odds.py" = ["F403", "F405"]
"unified_api_contracts/canonical/spread.py" = ["F403", "F405"]
# C901 complexity carveout for UAC registry/declarative paths
# (codified 2026-05-13 per codex/05-infrastructure/deployment-and-qg-strategy.md
# § "QG complexity (C901) policy — UAC carveout").
# UAC is registry/declarative, NOT algorithmic. KNOWN_VENUE_TOKENS,
# STRATEGY_FAMILY_REGISTRY, paired_dispersion_catalog, capability_declarations/*,
# ARCHETYPE_CONFIG_SEED, VENUE_DATA_TYPE_CAPABILITIES, per-venue order-status
# dispatchers, sports path-template dispatch — all enumerate closed sets.
# Lowering complexity = artificial extraction that fragments registry view +
# harms grep-ability. Phase 8 surface coverage targets (100% on validation +
# registry consumers) is the real correctness gate, not C901.
"unified_api_contracts/registry/**/*.py" = ["C901"]
"unified_api_contracts/internal/architecture_v2/**/*.py" = ["C901"]
"unified_api_contracts/canonical/crosscutting/**/*.py" = ["C901"]
# E402 in normalize.py: TYPE_CHECKING / lazy imports after module-level registry setup
"unified_api_contracts/external/**/normalize.py" = ["C901", "E402", "E731"]
"unified_api_contracts/canonical/domain/sports/gcs_paths.py" = ["C901"]
"unified_api_contracts/canonical/domain/sports/mapping_resolver.py" = ["C901"]
# F403 in crosscutting facades — intentional wildcard re-exports for domain surface
"unified_api_contracts/canonical/crosscutting/__init__.py" = ["F403", "F405"]
"unified_api_contracts/canonical/crosscutting/errors/__init__.py" = ["F403", "F405"]
# RUF001/RUF002 — intentional Unicode math symbols (×, ℤ) in API/domain strings+docstrings
"unified_api_contracts/canonical/crosscutting/alerting/thresholds.py" = ["C901", "RUF001"]
"unified_api_contracts/canonical/crosscutting/bar_boundary.py" = ["RUF002"]
"unified_api_contracts/external/api_football/team_mappings.py" = ["RUF001"]
# wallet_config: × in string (on-chain gas estimate note); SIM102 nested-if is intentional guard
"unified_api_contracts/internal/domain/defi/wallet_config.py" = ["RUF001", "SIM102"]
# instrument.py: × in comments (e.g. "2x") — intentional math notation
"unified_api_contracts/internal/reference/instrument.py" = ["RUF003"]
# polygon schemas: `l` is liquidity (external API field alias)
"unified_api_contracts/external/polygon/schemas.py" = ["E741"]
# internal __init__ re-exports signals: F401 (redundant alias), RUF022 (__all__ domain-grouped)
"unified_api_contracts/internal/__init__.py" = ["F401", "RUF022"]
# E402 in instruments domain __init__ — contract registration after base class
"unified_api_contracts/internal/domain/instruments/__init__.py" = ["E402", "F401"]
# N815: protocol_params mirrors on-chain ABI camelCase field names
"unified_api_contracts/internal/domain/features_onchain/protocol_params.py" = ["N815"]
# N818: ExclusiveLockViolation is domain concept (advisory lock), not Python exception hierarchy
"unified_api_contracts/internal/domain/strategy_service/subscription.py" = ["N818"]
# Test-file suppressions — pre-existing patterns intentional in test context:
# N806/N811/N814: naming convention violations (test setup uses UPPER_CASE vars/aliases)
# RUF001-003: Unicode × in docstrings/comments (intentional math notation)
# RUF043: regex metacharacters in pytest match= (intentional raw patterns)
# RUF059: unused unpacked variable in multi-assign test patterns
# B017: blind except Exception (acceptable in assertion-style tests)
# C408: dict() call (minor style; not worth refactoring test fixtures)
# E402: imports after conditional or fixture setup (common test pattern)
"tests/**/*.py" = ["N806", "N811", "N814", "RUF001", "RUF002", "RUF003", "RUF043", "RUF059", "B017", "C408", "E402"]
"tests/*.py" = ["N806", "N811", "N814", "RUF001", "RUF002", "RUF003", "RUF043", "RUF059", "B017", "C408", "E402"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["unified_api_contracts"]
exclude = ["tests", "**/__pycache__", ".venv*", ".venv-workspace", "build", "dist", "node_modules", "unified_api_contracts/testing/**", "unified_api_contracts/testing", "unified_api_contracts/internal/testing/**", "unified_api_contracts/internal/testing"]
# Preserve repo-specific: warning (not none) for private usage — external modules use normalize_utils helpers
reportAny = "error"

[[tool.basedpyright.executionEnvironments]]
root = "."
pythonVersion = "3.13"
pythonPlatform = "All"
extraPaths = []

[tool.coverage.run]
source = ["unified_api_contracts"]
branch = true
# Transitional: exclude new-path copies until old paths are removed (citadel phase 1)
omit = [
    "unified_api_contracts/normalize_utils/*",
    "unified_api_contracts/normalize_utils/errors/*",
    "unified_api_contracts/canonical/crosscutting/*",
    "unified_api_contracts/canonical/crosscutting/errors/*",
    "unified_api_contracts/registry/venue_manifest/*",
    "unified_api_contracts/registry/venue_rate_limits.py",
    "unified_api_contracts/registry/provider_modes.py",
    # Root-level and canonical-level facades (thin re-exports, citadel phase 2)
    "unified_api_contracts/market.py",
    "unified_api_contracts/execution.py",
    "unified_api_contracts/reference.py",
    "unified_api_contracts/sports.py",
    "unified_api_contracts/sports_reference.py",
    "unified_api_contracts/position.py",
    "unified_api_contracts/features.py",
    "unified_api_contracts/derivatives.py",
    "unified_api_contracts/infrastructure.py",
    "unified_api_contracts/errors.py",
    "unified_api_contracts/rate_limits.py",
    "unified_api_contracts/connectivity.py",
    "unified_api_contracts/latency.py",
    "unified_api_contracts/odds.py",
    "unified_api_contracts/options.py",
    "unified_api_contracts/canonical/execution.py",
    "unified_api_contracts/canonical/options.py",
    "unified_api_contracts/canonical/odds.py",
    "unified_api_contracts/canonical/spread.py",
    # Domain sub-packages created in citadel phase 2 (moved from flat files)
    "unified_api_contracts/canonical/domain/position/*",
    "unified_api_contracts/canonical/domain/reference/*",
    "unified_api_contracts/canonical/domain/market/spread.py",
    # Transitional: normalize and errors modules added in Phase 3 sports/sources flattening
    "unified_api_contracts/canonical/normalize/*",
    "unified_api_contracts/canonical/errors/*",
    "unified_api_contracts/canonical/canonical_mappings.py",
    # Phase 3 flattening: features modules moved into canonical/domain/sports/
    "unified_api_contracts/canonical/domain/sports/_features_*.py",
    "unified_api_contracts/canonical/domain/sports/features.py",
    "unified_api_contracts/canonical/domain/sports/processed_odds.py",
    # Phase 3 flattening: normalize modules added to external vendor directories
    "unified_api_contracts/external/*/normalize.py",
    # Phase 3 flattening: new schema files not yet covered
    "unified_api_contracts/external/baker_hughes/schemas.py",
    "unified_api_contracts/external/cftc/schemas.py",
    "unified_api_contracts/external/eia/schemas.py",
    "unified_api_contracts/external/databento/schemas_columns.py",
    "unified_api_contracts/config/provider_modes.py",
    # Phase 3 sportsbook stubs: Playwright-scraped HTML schemas, no unit tests yet
    "unified_api_contracts/external/bet365/schemas.py",
    "unified_api_contracts/external/bet365/__init__.py",
    "unified_api_contracts/external/bet888sport/schemas.py",
    "unified_api_contracts/external/bet888sport/__init__.py",
    "unified_api_contracts/external/betfred/schemas.py",
    "unified_api_contracts/external/betfred/__init__.py",
    "unified_api_contracts/external/betvictor/schemas.py",
    "unified_api_contracts/external/betvictor/__init__.py",
    "unified_api_contracts/external/betway/schemas.py",
    "unified_api_contracts/external/betway/__init__.py",
    "unified_api_contracts/external/boylesports/schemas.py",
    "unified_api_contracts/external/boylesports/__init__.py",
    "unified_api_contracts/external/bwin/schemas.py",
    "unified_api_contracts/external/bwin/__init__.py",
    "unified_api_contracts/external/coral/schemas.py",
    "unified_api_contracts/external/coral/__init__.py",
    "unified_api_contracts/external/sbobet/schemas.py",
    "unified_api_contracts/external/sbobet/__init__.py",
    "unified_api_contracts/external/oddspapi/schemas.py",
    "unified_api_contracts/external/oddspapi/__init__.py",
    "unified_api_contracts/external/odds_api/_market_keys.py",
    # Phase 7 citadel: capability registry (data declarations, not business logic)
    "unified_api_contracts/registry/capability.py",
    "unified_api_contracts/registry/capability_data.py",
    # Internal contracts (merged from unified-internal-contracts) — coverage tracked separately
    "unified_api_contracts/internal/*",
]

[tool.coverage.report]
# branch=True added by 6fb90b19 lowers coverage vs statement-only baseline; recalibrated to 83
fail_under = 83
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]

[tool.quality-gates]
repo_arch_tier = "0"

[tool.bandit]
skips = []   # per-repo: add bandit check IDs WITH a comment explaining why (e.g. "B608: ...")
