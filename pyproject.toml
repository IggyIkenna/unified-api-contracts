[tool.uv]
# pip-audit: eth-abi 4.2.1 GHSA-3qwc-47jf-5rf7 → 5.0.1; gunicorn 21.2.0 CVE-2024-* → 22.0.0
override-dependencies = [
    "eth-abi>=5.0.1",
    "gunicorn>=22.0.0",
]

[build-system]
requires = ["setuptools>=75,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-api-contracts"
version = "0.2.32"
description = "Pydantic schemas and VCR mocks for external APIs used by UMI, UOI, and unified-trading library"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Ikenna Igboaka" }]
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.12.5,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/IggyIkenna/unified-api-contracts"
Repository = "https://github.com/IggyIkenna/unified-api-contracts"

[project.optional-dependencies]
# Schema-validation: SDK pins for validating schemas against real API responses.
# Interfaces (UMI, unified-trading-library) may use different versions but must align with schemas.
schema-validation = [
    "requests>=2.32.5,<3.0.0",
    "databento>=0.32.0,<1.0.0",      # Databento Historical/Live API validation
    "tardis-client>=1.3.7,<2.0.0",   # Tardis HTTP API v1 validation
    "ccxt>=4.5.24,<5.0.0",    # CCXT unified response validation
    "ib_insync>=0.9.86,<1.0.0",      # IBKR TWS/ib_insync schema validation (UTEI)
]
dev = [
    "pytest>=9.0.1,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-asyncio>=0.25.0,<2.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "ruff==0.15.0",
    "basedpyright==1.38.2",
    "pip-audit>=2.7.0,<3.0.0",
    "bandit>=1.7.0,<2.0.0",
    "vcrpy>=6.0.0,<7.0.0",
    "requests>=2.32.5,<3.0.0",
    "pre-commit>=3.0,<4.0.0",
    "hypothesis>=6.0.0,<7.0.0",
    "httpx>=0.28.1,<1.0.0",
]
# For live contract verification (install from workspace path, not PyPI):
#   uv pip install -e ../unified-trading-library -e ../unified-config-interface
#   Live verification is run in the six interfaces (see README).
# UCI/UCS are not listed here so unified-api-contracts remains installable without them.

[tool.setuptools.packages.find]
where = ["."]
include = ["unified_api_contracts*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "smoke: Smoke tests",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "G"]
ignore = ["G003", "G004"]  # E501; G004: f-strings in logger (print->logger migration)
# G004: allow f-strings in logger (print->logger migration) enforced (line-length 120)
# N815/N803: camelCase/PascalCase required for API contracts mirroring external APIs (Binance, boto3, GCP SDK)

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.ruff.lint.per-file-ignores]
"unified_api_contracts/**/schemas.py" = ["N815"]
"unified_api_contracts/unified_api_contracts_external/**/schemas.py" = ["N815"]
"unified_api_contracts/unified_api_contracts_external/**/__init__.py" = ["N815"]
"unified_api_contracts/unified_api_contracts_external/yahoo_finance/__init__.py" = ["N815"]
"unified_api_contracts/unified_api_contracts_external/binance/*.py" = ["N815", "F403", "F405"]
"unified_api_contracts/unified_api_contracts_external/cloud_sdks/*.py" = ["N803", "N815", "F403", "F405"]
"unified_api_contracts/unified_api_contracts_external/cloud_sdks/**/*.py" = ["N803", "N815", "F403", "F405"]
"unified_api_contracts/unified_normalised_contracts/normalize/orders_fills.py" = ["F401"]
"unified_api_contracts/schemas/protocol_sdks.py" = ["N815"]
"unified_api_contracts/schemas/accounts.py" = ["N815"]
"unified_api_contracts/schemas/cex_withdrawals.py" = ["N815"]
"unified_api_contracts/schemas/derivatives.py" = ["N815"]
"unified_api_contracts/schemas/transfers.py" = ["N815"]
"unified_api_contracts/mev/*.py" = ["N815"]
"unified_api_contracts/cloud_sdks/*.py" = ["N803", "N815"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
[tool.basedpyright]
# Enforce no Any/object — use specific types
reportAny = "error"
reportUnknownVariableType = "error"
reportUnknownArgumentType = "error"
reportUnknownParameterType = "error"
reportUnknownMemberType = "error"
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["unified_api_contracts"]
exclude = ["**/__pycache__", ".venv*", "build", "dist"]
useLibraryCodeForTypes = true

[tool.coverage.report]
fail_under = 84
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]

[tool.quality-gates]
repo_arch_tier = "0"
