name: Schema Health Update (Cross-Repo Artifacts)

# Downloads schema health artifacts produced by interface repo CI runs,
# feeds them into read_schema_health_artifacts.py, and commits an updated
# docs/schema_health.svg to main.
#
# Interface repos (UMI, USEI) upload {provider}_schema_health.json artifacts
# after their schema_validation test suites complete.  This job collects those
# artifacts cross-repo and regenerates the SVG health matrix.
#
# Trigger: manual (workflow_dispatch) or scheduled weekly as a fallback.

on:
  workflow_dispatch:
    inputs:
      umi_run_id:
        description: "unified-market-interface workflow run ID to pull artifacts from"
        required: false
        default: ""
      usei_run_id:
        description: "unified-sports-execution-interface workflow run ID to pull artifacts from"
        required: false
        default: ""
      fail_on_red:
        description: "Fail the job if any provider has red status"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

  schedule:
    # Weekly on Sundays at 04:00 UTC (after the schema-health.yml at 02:00)
    - cron: "0 4 * * 0"

jobs:
  schema-health-update:
    name: Download Artifacts & Update SVG
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write # needed to commit updated SVG
      actions: read # needed to download artifacts from other repos

    steps:
      - name: Checkout unified-api-contracts
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[test]"

      - name: Create schema_artifacts directory
        run: mkdir -p schema_artifacts

      # ---------------------------------------------------------------------------
      # Download artifacts from unified-market-interface (crypto providers: Binance, OKX, Bybit)
      # ---------------------------------------------------------------------------

      - name: Download UMI schema health artifacts (specific run)
        if: inputs.umi_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: schema-health-artifacts
          path: schema_artifacts/umi/
          github-token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/unified-market-interface
          run-id: ${{ inputs.umi_run_id }}
        continue-on-error: true

      - name: Download UMI schema health artifacts (latest run)
        if: inputs.umi_run_id == ''
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: quality-gates.yml
          name: schema-health-artifacts
          path: schema_artifacts/umi/
          repo: ${{ github.repository_owner }}/unified-market-interface
          github_token: ${{ secrets.GH_PAT }}
          if_no_artifact_found: warn
        continue-on-error: true

      # ---------------------------------------------------------------------------
      # Download artifacts from unified-sports-execution-interface (sports providers)
      # ---------------------------------------------------------------------------

      - name: Download USEI schema health artifacts (specific run)
        if: inputs.usei_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: schema-health-artifacts
          path: schema_artifacts/usei/
          github-token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/unified-sports-execution-interface
          run-id: ${{ inputs.usei_run_id }}
        continue-on-error: true

      - name: Download USEI schema health artifacts (latest run)
        if: inputs.usei_run_id == ''
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: quality-gates.yml
          name: schema-health-artifacts
          path: schema_artifacts/usei/
          repo: ${{ github.repository_owner }}/unified-sports-execution-interface
          github_token: ${{ secrets.GH_PAT }}
          if_no_artifact_found: warn
        continue-on-error: true

      # ---------------------------------------------------------------------------
      # Flatten all downloaded artifacts into a single schema_artifacts/ dir
      # ---------------------------------------------------------------------------

      - name: Flatten artifacts into schema_artifacts/
        run: |
          echo "=== Artifacts before flattening ==="
          find schema_artifacts/ -name "*.json" 2>/dev/null || echo "(none)"

          # Flatten: move umi/ and usei/ subdirectory JSON files to root
          for subdir in schema_artifacts/umi schema_artifacts/usei; do
            if [ -d "$subdir" ]; then
              find "$subdir" -name "*_schema_health.json" -exec mv {} schema_artifacts/ \;
              rmdir "$subdir" 2>/dev/null || :
            fi
          done

          echo "=== Artifacts after flattening ==="
          find schema_artifacts/ -name "*.json" 2>/dev/null || echo "(none)"

      # ---------------------------------------------------------------------------
      # Regenerate SVG from artifacts
      # ---------------------------------------------------------------------------

      - name: Read schema health artifacts and update SVG
        id: update_svg
        run: |
          FAIL_ON_RED_FLAG=""
          if [ "${{ inputs.fail_on_red }}" = "false" ]; then
            FAIL_ON_RED_FLAG="--no-fail-on-red"
          fi
          python3 scripts/read_schema_health_artifacts.py \
            --artifacts-dir schema_artifacts/ \
            $FAIL_ON_RED_FLAG
        continue-on-error: ${{ inputs.fail_on_red == 'false' }}

      # Regenerate the full schema matrix (YAML-based, provider_api_versions.yaml)
      - name: Regenerate schema version matrix
        run: python3 scripts/generate_schema_audit_matrix.py
        continue-on-error: true

      # ---------------------------------------------------------------------------
      # Commit updated SVG and matrix docs
      # ---------------------------------------------------------------------------

      - name: Commit updated schema health SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update schema health SVG from CI artifacts [skip ci]"
          file_pattern: "docs/schema_health.svg docs/SCHEMA_VERSION_MATRIX.md"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          skip_dirty_check: false

      # ---------------------------------------------------------------------------
      # Upload consolidated artifacts for audit trail
      # ---------------------------------------------------------------------------

      - name: Upload merged schema health artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-schema-health-artifacts
          path: |
            schema_artifacts/*.json
          retention-days: 30
          if-no-files-found: warn

      # ---------------------------------------------------------------------------
      # Hard fail signal (after commit so SVG is updated even on failure)
      # ---------------------------------------------------------------------------

      - name: Fail if red providers detected
        if: steps.update_svg.outcome == 'failure' && inputs.fail_on_red != 'false'
        run: |
          echo "::error::One or more providers have red schema health status."
          echo "Check docs/schema_health.svg and the merged-schema-health-artifacts upload for details."
          exit 1
